<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" fill="none">
  <!-- Shield Icon -->
  <g transform="translate(10, 5)">
    <!-- Cyan Polygon -->
    <path d="M 0,20 L 70,80 L 0,140 Z" fill="#00AEEF"/>
    <!-- Green Polygon -->
    <path d="M 30,0 L 170,0 L 30,140 L 0,170 L 30,220 L 170,80 Z" fill="#10B981"/>
    <!-- Orange Polygon -->
    <path d="M 190,0 L 240,45 L 190,90 Z" fill="#F97316"/>
    <!-- Yellow/Orange Shield Base -->
    <path d="M 65,160 L 170,80 L 170,170 L 80,240 Z" fill="#F59E0B"/>
  </g>

  <!-- Text: D Y PATIL INTERNATIONAL UNIVERSITY -->
  <text x="270" y="42" font-family="'Inter', system-ui, sans-serif" font-weight="900" font-size="34" fill="#050554" letter-spacing="1">D Y PATIL</text>
  <text x="270" y="86" font-family="'Inter', system-ui, sans-serif" font-weight="900" font-size="31" fill="#050554" letter-spacing="0.5">INTERNATIONAL</text>
  <text x="270" y="128" font-family="'Inter', system-ui, sans-serif" font-weight="900" font-size="33" fill="#050554" letter-spacing="1">UNIVERSITY</text>
  
  <!-- AKURDI PUNE -->
  <text x="272" y="160" font-family="'Inter', system-ui, sans-serif" font-weight="500" font-size="18" fill="#050554" letter-spacing="8">AKURDI PUNE</text>

  <!-- Tagline: Think | Thrive | Transform -->
  <text x="70" y="210" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="23" fill="#050554">Think  |  Thrive  |  Transform</text>
</svg>
